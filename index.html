<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        #todoList {
            border-collapse: collapse;
            width: 70%;
            margin: 20px auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        #todoList th, #todoList td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        #todoList th {
            background-color: #4CAF50;
            color: white;
        }
        #todoList tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        #todoList tr:hover {
            background-color: #f5f5f5;
        }
        .add-form {
            margin-top: 20px;
            width: 70%;
            margin: 20px auto;
            display: flex;
            gap: 10px;
        }
        .add-form input[type="text"] {
            padding: 10px;
            flex-grow: 1;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .add-form button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .add-form button:hover {
            background-color: #45a049;
        }
        .delete-btn {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>

<table id="todoList">
    <thead>
        <tr>
            <th>#</th>
            <th>Task</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="listBody">
        {{rows}}
    </tbody>
</table>

<div class="add-form">
    <input type="text" id="newItem" placeholder="Enter new task...">
    <button onclick="addItem()">Add Task</button>
</div>

<script>
    async function addItem() {
        const newItemInput = document.getElementById('newItem');
        const newItemText = newItemInput.value.trim();

        if (newItemText) {
            try {
                const response = await fetch('/add', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: newItemText })
                });

                if (response.ok) {
                    const newItem = await response.json();
                    addItemToTable(newItem);
                    newItemInput.value = '';
                } else {
                    alert('Failed to add item');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error adding item');
            }
        }
    }

    async function removeItem(id, rowElement) {
        if (!confirm('Are you sure you want to delete this task?')) {
            return;
        }
        
        try {
            const response = await fetch(`/remove/${id}`, {
                method: 'DELETE'
            });
            
            const result = await response.json();
            
            if (result.success) {
                rowElement.remove();
            } else {
                alert('Failed to remove item');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error removing item');
        }
    }

    function addItemToTable(item) {
        const tableBody = document.getElementById('listBody');
        const row = document.createElement('tr');
        row.id = `row-${item.id}`;
        row.innerHTML = `
            <td>${item.id}</td>
            <td>${item.text}</td>
            <td>
                <button class="delete-btn" onclick="removeItem(${item.id}, this.parentNode.parentNode)">
                    Delete
                </button>
            </td>
        `;
        tableBody.appendChild(row);
    }
</script>

</body>
</html>
